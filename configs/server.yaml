# Frozen preprocessing and model identities match the validated implementation.
model_scale: base
seed: 1
device: auto
hf_endpoint: ''
dataset:
  name: cifar100
  root: ../DATASETS/
  manifest: null
  download: false
  batch_size: 32
  num_workers: 4
noise:
  type: none
  rate: 0.6
  variant: fine
  human_root: null
models:
  vit:
    enabled: true
    architecture: vit_b16_imagenet
    pretrained: true
    checkpoint_path: null
  clip:
    enabled: true
    architecture: clip_vit_b16
    pretrained: true
    checkpoint_path: null
  dino:
    enabled: true
    architecture: dinov2_vit_b14
    pretrained: true
    checkpoint_path: null
  deit3:
    provider: timm
    architecture: deit3_base_patch16_224.fb_in22k_ft_in1k
    pretrained: true
    checkpoint_path: null
  convnextv2:
    provider: timm
    architecture: convnextv2_base.fcmae_ft_in22k_in1k
    pretrained: true
    checkpoint_path: null
feature:
  normalize: true
  cache: true
  root: ./cache
output:
  root: outputs/feature_extraction
